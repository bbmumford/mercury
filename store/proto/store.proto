syntax = "proto3";
package mercury.store.v1;
option go_package = "github.com/bbmumford/mercury/store/proto";

message StoreRootProto {
    bytes ownerPubKey = 1;
    string name = 2;
    string description = 3;
    repeated string categories = 4;
    bytes merkleRoot = 5;
    uint64 version = 6;
    int64 timestampUnixMs = 7;
    bytes signature = 8;
}

message ListingProto {
    string id = 1;
    string title = 2;
    string description = 3;
    uint64 price = 4;
    string currency = 5;
    repeated string images = 6;
    repeated VariantProto variants = 7;
    repeated ShippingOptionProto shippingOpts = 8;
    bool digital = 9;
    string digitalCid = 10;
    int64 createdAtUnixMs = 11;
    int64 updatedAtUnixMs = 12;
}

message VariantProto {
    string name = 1;
    string value = 2;
    int64 priceModifier = 3;
}

message ShippingOptionProto {
    string name = 1;
    uint64 price = 2;
    int32 estDays = 3;
}

message StoreAdProto {
    bytes ownerPubKey = 1;
    string name = 2;
    repeated string categories = 3;
    uint64 version = 4;
    uint64 listingCount = 5;
    bytes merkleRoot = 6;
    bytes signature = 7;
}

message PinAnnouncementProto {
    bytes replicatorPubKey = 1;
    string storeId = 2;
    uint64 storeVersion = 3;
    uint64 capacityMb = 4;
    bytes signature = 5;
}

message StoreRequest {
    string storeId = 1;
    string listingId = 2;
    string mediaCid = 3;
    bytes nonce = 4;
}

message StoreResponse {
    bytes payload = 1;
    bytes merkleProof = 2;
    bytes contentHash = 3;
}
