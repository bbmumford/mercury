<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercury Marketplace</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9791;</text></svg>">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mercury">
</head>
<body>
  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Offline indicator (shown when navigator reports offline) -->
  <div id="offline-banner" class="offline-banner hidden" role="status" aria-live="polite">
    You are offline &mdash; cached content only
  </div>

  <!-- Top navigation -->
  <nav id="main-nav">
    <div class="nav-left">
      <a href="#/" class="nav-logo">
        <span class="logo-icon">&#9791;</span>
        <span class="logo-text">Mercury</span>
      </a>
      <div class="nav-search" id="nav-search-container">
        <input type="text" id="global-search" placeholder="Search listings..." autocomplete="off">
        <div id="search-results-dropdown" class="search-dropdown hidden"></div>
      </div>
    </div>
    <div class="nav-right">
      <a href="#/browse" class="nav-link" data-nav="browse">Browse</a>
      <a href="#/store" class="nav-link" data-nav="store">My Store</a>
      <a href="#/orders" class="nav-link" data-nav="orders">Orders</a>
      <a href="#/wallet" class="nav-link" data-nav="wallet">Wallet</a>
      <a href="#/messages" class="nav-link" data-nav="messages">
        Messages
        <span id="unread-badge" class="badge hidden">0</span>
      </a>
      <a href="#/settings" class="nav-link" data-nav="settings">
        <span class="avatar-small" id="nav-avatar"></span>
      </a>
    </div>
    <button id="mobile-menu-toggle" class="mobile-menu-btn">&#9776;</button>
  </nav>

  <!-- Mobile nav overlay -->
  <div id="mobile-nav" class="mobile-nav hidden">
    <a href="#/browse" class="mobile-nav-link">Browse</a>
    <a href="#/store" class="mobile-nav-link">My Store</a>
    <a href="#/orders" class="mobile-nav-link">Orders</a>
    <a href="#/wallet" class="mobile-nav-link">Wallet</a>
    <a href="#/messages" class="mobile-nav-link">Messages</a>
    <a href="#/settings" class="mobile-nav-link">Settings</a>
    <a href="#" class="mobile-nav-link" id="mobile-logout">Logout</a>
  </div>

  <!-- Main content area -->
  <main id="app"></main>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <p class="loading-text">Initialising Mercury...</p>
  </div>

  <!-- Auth screen (shown before login) -->
  <div id="auth-screen" class="auth-screen hidden"></div>

  <!-- Scripts -->
  <script src="wasm_exec.js"></script>
  <script src="js/mercury.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/browse.js"></script>
  <script src="js/order.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/reputation.js"></script>
  <script src="js/arbitration.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>

  <!-- PWA: service worker registration + offline indicator -->
  <script>
    (function () {
      'use strict';
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function (err) {
            console.warn('[pwa] SW register failed', err);
          });
        });
      }

      var banner = document.getElementById('offline-banner');
      function updateOnlineState() {
        if (!banner) return;
        if (navigator.onLine) {
          banner.classList.add('hidden');
        } else {
          banner.classList.remove('hidden');
        }
      }
      window.addEventListener('online', updateOnlineState);
      window.addEventListener('offline', updateOnlineState);
      updateOnlineState();
    })();
  </script>
</body>
</html>
